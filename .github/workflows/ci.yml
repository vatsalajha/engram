name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Placeholder key: passes config validation; the "..." keeps every
      # integration suite skipped (tests gate on !key.includes("...")).
      DASHSCOPE_API_KEY: sk-ci-...
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
